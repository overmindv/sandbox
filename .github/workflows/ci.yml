name: CI
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sandbox-ci
          POSTGRES_DB: sandbox_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate execution wire schemas
        run: |
          python -m pip install -r scripts/requirements-contract.txt
          python scripts/check_execution_contract.py
      - name: Check runtime isolation preflight
        run: python -m unittest discover -s scripts -p test_runtime_isolation.py
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
      - run: make ctest
        env:
          COMPONENT_TEST_DSN: postgres://postgres:sandbox-ci@localhost:5432/sandbox_test?sslmode=disable

  cpp-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the runner and GCC compiler
        run: |
          docker build -f deployments/docker/Dockerfile.gojudge-runtime --target runner -t overmindv/sandbox-gojudge:local .
          docker build -f deployments/docker/Dockerfile.gojudge-runtime --target cpp-compiler -t overmindv/sandbox-gojudge-cpp:14.2.0 .
      - run: sh scripts/test-cpp-live.sh
