apiVersion: v1
kind: Secret
metadata:
  name: sandbox-worker-secrets
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: overmindv-sandbox
type: Opaque
stringData:
  SANDBOX_POSTGRES_DSN: postgresql://sandbox:change-me@postgres.data.svc.cluster.local:5432/sandbox?sslmode=require
  SANDBOX_TESTS_ACCESS_KEY_ID: change-me
  SANDBOX_TESTS_SECRET_ACCESS_KEY: change-me
  SANDBOX_ARTIFACTS_ACCESS_KEY_ID: change-me
  SANDBOX_ARTIFACTS_SECRET_ACCESS_KEY: change-me
