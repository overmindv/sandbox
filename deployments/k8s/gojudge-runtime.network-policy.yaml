apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gojudge-runtime
  namespace: sandbox
  labels:
    app.kubernetes.io/name: gojudge
    app.kubernetes.io/component: sandbox-runtime
    app.kubernetes.io/part-of: overmindv-sandbox
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gojudge
      app.kubernetes.io/component: sandbox-runtime
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: sandbox-worker
              app.kubernetes.io/component: worker
      ports:
        - protocol: TCP
          port: 5050
  egress: []
