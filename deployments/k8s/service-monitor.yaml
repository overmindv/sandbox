apiVersion: v1
kind: Service
metadata:
  name: sandbox-worker
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: overmindv-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sandbox-worker
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sandbox-worker
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: overmindv-sandbox
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sandbox-worker
      app.kubernetes.io/component: worker
  namespaceSelector:
    matchNames:
      - sandbox
  endpoints:
    - port: metrics
      path: /metrics
      interval: 10s
      scrapeTimeout: 3s
