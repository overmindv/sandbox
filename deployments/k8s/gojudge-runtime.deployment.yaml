apiVersion: v1
kind: Service
metadata:
  name: gojudge
  namespace: sandbox
  labels:
    app.kubernetes.io/name: gojudge
    app.kubernetes.io/component: sandbox-runtime
    app.kubernetes.io/part-of: overmindv-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gojudge
    app.kubernetes.io/component: sandbox-runtime
  ports:
    - name: http
      port: 5050
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojudge
  namespace: sandbox
  labels:
    app.kubernetes.io/name: gojudge
    app.kubernetes.io/component: sandbox-runtime
    app.kubernetes.io/part-of: overmindv-sandbox
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: gojudge
      app.kubernetes.io/component: sandbox-runtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojudge
        app.kubernetes.io/component: sandbox-runtime
        app.kubernetes.io/part-of: overmindv-sandbox
      annotations:
        container.apparmor.security.beta.kubernetes.io/gojudge: unconfined
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      nodeSelector:
        overmindv.io/node-pool: sandbox-runtime
      tolerations:
        - key: overmindv.io/sandbox-runtime
          operator: Equal
          value: "true"
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gojudge
              app.kubernetes.io/component: sandbox-runtime
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gojudge
          image: overmindv/sandbox-gojudge:dev
          imagePullPolicy: IfNotPresent
          args:
            - -http-addr
            - 0.0.0.0:5050
            - -parallelism
            - "16"
            - -container-cred-start
            - "10000"
            - -tmp-fs-param
            - size=128m,nr_inodes=4096
            - -output-limit
            - "1048576"
            - -copy-out-limit
            - "1048576"
            - -file-timeout
            - 30m
            - -no-fallback
          ports:
            - name: http
              containerPort: 5050
              protocol: TCP
          startupProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 5
            failureThreshold: 2
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /w
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
