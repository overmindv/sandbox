apiVersion: v1
kind: Service
metadata:
  name: gojudge-compiler
  namespace: sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gojudge-compiler
    app.kubernetes.io/component: sandbox-runtime
  ports:
    - name: http
      port: 5050
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gojudge-compiler
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gojudge-compiler
      app.kubernetes.io/component: sandbox-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gojudge-compiler
        app.kubernetes.io/component: sandbox-runtime
        app.kubernetes.io/part-of: overmindv-sandbox
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/arch: amd64
        overmindv.io.node-restriction.kubernetes.io/pool: sandbox-runtime
      tolerations:
        - key: overmindv.io/sandbox-runtime
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: gojudge
          image: overmindv/sandbox-gojudge:dev
          imagePullPolicy: IfNotPresent
          args:
            - -http-addr
            - 0.0.0.0:5050
            - -parallelism
            - "2"
            - -container-cred-start
            - "10000"
            - -tmp-fs-param
            - size=128m,nr_inodes=4096
            - -output-limit
            - "33554432"
            - -copy-out-limit
            - "1048576"
            - -file-timeout
            - 2m
            - -no-fallback
          ports:
            - name: http
              containerPort: 5050
          startupProbe:
            httpGet:
              path: /version
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /version
              port: http
          readinessProbe:
            httpGet:
              path: /version
              port: http
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 3Gi
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: work
              mountPath: /w
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
