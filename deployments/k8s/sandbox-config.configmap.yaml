apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-worker-config
  namespace: sandbox
  labels:
    app.kubernetes.io/name: sandbox-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: overmindv-sandbox
data:
  SANDBOX_CONFIG_FILE: configs/dev.yaml
  SANDBOX_ENV: dev

  SANDBOX_KAFKA_BROKERS: sandbox-kafka-bootstrap.kafka.svc.cluster.local:9092
  SANDBOX_KAFKA_CLIENT_ID: sandbox-worker-k8s
  SANDBOX_KAFKA_GROUP_ID: sandbox-code-execution-v1
  SANDBOX_KAFKA_TOPIC_REQUESTS: code-execution.requests.v1
  SANDBOX_KAFKA_TOPIC_RETRY: code-execution.retry.v1
  SANDBOX_KAFKA_TOPIC_EVENTS: code-execution.events.v1
  SANDBOX_KAFKA_TOPIC_RESULTS: code-execution.results.v1
  SANDBOX_KAFKA_TOPIC_DEADLETTER: code-execution.deadletter.v1
  SANDBOX_KAFKA_RETRY_ENABLED: "true"
  SANDBOX_KAFKA_RETRY_MAX_ATTEMPTS: "4"
  SANDBOX_KAFKA_RETRY_INITIAL_BACKOFF_MS: "1000"
  SANDBOX_KAFKA_RETRY_MAX_BACKOFF_MS: "60000"
  SANDBOX_KAFKA_RETRY_BACKOFF_MULTIPLIER: "2"
  SANDBOX_KAFKA_RETRY_EARLY_SLEEP_CAP_MS: "10000"

  SANDBOX_EXECUTOR_TYPE: gojudge
  SANDBOX_GOJUDGE_BASE_URL: http://gojudge.sandbox.svc.cluster.local:5050
  SANDBOX_EXECUTOR_CLIENT_TIMEOUT_MS: "20000"

  SANDBOX_FEATURE_FAKE_EXECUTOR: "false"
  SANDBOX_FEATURE_GOJUDGE_EXECUTOR: "true"
  SANDBOX_FEATURE_INLINE_TESTS: "true"
  SANDBOX_FEATURE_OBJECT_STORAGE_TESTS: "true"
  SANDBOX_FEATURE_OBJECT_STORAGE_ARTIFACTS: "true"

  SANDBOX_MAX_IN_FLIGHT: "16"
  SANDBOX_PYTHON_MAX_IN_FLIGHT: "16"
  SANDBOX_SCHEDULER_JOB_TIMEOUT_MS: "30000"
  SANDBOX_SCHEDULER_QUEUE_MAX_DEPTH: "256"

  SANDBOX_TESTS_PROVIDER: s3
  SANDBOX_TESTS_BUCKET: sandbox-tests
  SANDBOX_TESTS_ENDPOINT: https://s3.dev.example.internal
  SANDBOX_TESTS_REGION: us-east-1
  SANDBOX_TESTS_KEY_PREFIX: sandbox-tests/dev
  SANDBOX_TESTS_OBJECT_MAX_BYTES: "1048576"
  SANDBOX_TESTS_REQUEST_TIMEOUT_MS: "10000"
  SANDBOX_TESTS_FORCE_PATH_STYLE: "false"

  SANDBOX_STORAGE_TYPE: postgres
  SANDBOX_ARTIFACTS_ENABLED: "true"
  SANDBOX_ARTIFACTS_PROVIDER: s3
  SANDBOX_ARTIFACTS_BUCKET: sandbox-artifacts
  SANDBOX_ARTIFACTS_ENDPOINT: https://s3.dev.example.internal
  SANDBOX_ARTIFACTS_REGION: us-east-1
  SANDBOX_ARTIFACTS_KEY_PREFIX: sandbox-artifacts/dev
  SANDBOX_ARTIFACTS_INLINE_MAX_BYTES: "4096"
  SANDBOX_ARTIFACTS_MAX_BYTES: "1048576"
  SANDBOX_ARTIFACTS_REQUEST_TIMEOUT_MS: "10000"
  SANDBOX_ARTIFACTS_FORCE_PATH_STYLE: "false"
  SANDBOX_RETENTION_COMPLETED_RUNS_DAYS: "30"
  SANDBOX_RETENTION_ARTIFACTS_DAYS: "14"
  SANDBOX_RETENTION_PUBLISHED_OUTBOX_DAYS: "7"
  SANDBOX_RETENTION_FAILED_OUTBOX_DAYS: "30"
  SANDBOX_RETENTION_IDEMPOTENCY_KEYS_DAYS: "30"
  SANDBOX_WORKER_HEARTBEAT_STALE_MS: "120000"

  SANDBOX_ALLOW_USER_CODE_NETWORK: "false"
  SANDBOX_DENY_METADATA_ENDPOINTS: "true"
  SANDBOX_REDACT_SECRETS: "true"

  SANDBOX_LOG_LEVEL: info
  SANDBOX_LOG_FORMAT: json
  SANDBOX_METRICS_ENABLED: "true"
  SANDBOX_TRACING_ENABLED: "true"
  SANDBOX_AUDIT_ENABLED: "true"
