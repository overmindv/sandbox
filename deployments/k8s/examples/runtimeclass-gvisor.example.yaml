apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    overmindv.io.node-restriction.kubernetes.io/pool: sandbox-runtime
  tolerations:
    - key: overmindv.io/sandbox-runtime
      operator: Equal
      value: "true"
      effect: NoSchedule
