services:
  broker:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,LOCAL:PLAINTEXT,CERT:SSL,AUTH:SASL_SSL
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,LOCAL://:19091,CERT://:19092,AUTH://:19093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://127.0.0.1:9092,LOCAL://127.0.0.1:${SANDBOX_TEST_PLAIN_PORT},CERT://127.0.0.1:${SANDBOX_TEST_MTLS_PORT},AUTH://127.0.0.1:${SANDBOX_TEST_SCRAM_PORT}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_SSL_KEYSTORE_TYPE: PEM
      KAFKA_SSL_KEYSTORE_LOCATION: /test-pki/broker.pem
      KAFKA_SSL_TRUSTSTORE_TYPE: PEM
      KAFKA_SSL_TRUSTSTORE_LOCATION: /test-pki/ca.pem
      KAFKA_LISTENER_NAME_CERT_SSL_CLIENT_AUTH: required
      KAFKA_LISTENER_NAME_AUTH_SSL_CLIENT_AUTH: none
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_LISTENER_NAME_AUTH_SCRAM___SHA___256_SASL_JAAS_CONFIG: org.apache.kafka.common.security.scram.ScramLoginModule required;
      KAFKA_LOG_DIRS: /tmp/kafka-security-data
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
    ports:
      - "127.0.0.1:${SANDBOX_TEST_PLAIN_PORT}:19091"
      - "127.0.0.1:${SANDBOX_TEST_MTLS_PORT}:19092"
      - "127.0.0.1:${SANDBOX_TEST_SCRAM_PORT}:19093"
    tmpfs:
      - /tmp/kafka-security-data:mode=1777,size=134217728
    volumes:
      - ${SANDBOX_TEST_KAFKA_BROKER_PKI:?use test fixture}:/test-pki:ro
