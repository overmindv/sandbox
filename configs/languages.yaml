schema_version: sandbox.languages.v1

defaults:
  language_id: python
  version: "3.12"
  test_mode: pytest
  limits_profile: python-default

languages:
  - id: python
    display_name: Python
    enabled: true
    adapter: python
    versions:
      - version: "3.12"
        default: true
        runtime_image: overmindv/sandbox-python:3.12
        runtime_version: "3.12.16"
        limits_profile: python-default
        test_modes:
          - pytest
        file_policy:
          max_files: 32
          allowed_extensions:
            - .py
            - .txt
            - .json
          default_entrypoint: solution.py
          default_test_entrypoint: test_solution.py
        execution:
          kind: interpreted
          working_dir: /workspace
          command:
            argv:
              - python3
              - -m
              - pytest
              - -q
              - --disable-warnings
              - --tb=short
              - -p
              - _sandbox_pytest_plugin
          environment:
            PYTHONDONTWRITEBYTECODE: "1"
            PYTHONHASHSEED: "0"
            PYTHONUNBUFFERED: "1"
            PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

  - id: javascript
    display_name: JavaScript
    enabled: false
    adapter: javascript
    versions:
      - version: "24"
        default: true
        runtime_image: overmindv/sandbox-gojudge-javascript:24.22.3
        runtime_version: "24.22.3"
        limits_profile: default
        test_modes: []
        file_policy:
          max_files: 32
          allowed_extensions:
            - .js
            - .mjs
            - .cjs
            - .json
          default_entrypoint: solution.js
        execution:
          kind: interpreted
          working_dir: /workspace
          command:
            argv:
              - /usr/local/bin/node
          environment: {}

  - id: go
    display_name: Go
    enabled: true
    adapter: go
    versions:
      - version: "1.26"
        default: true
        runtime_image: overmindv/sandbox-go:1.26
        runtime_version: "1.26.11"
        limits_profile: go-default
        test_modes:
          - go-test
        file_policy:
          max_files: 64
          allowed_extensions:
            - .go
            - .mod
            - .sum
          default_entrypoint: solution.go
          default_test_entrypoint: solution_test.go
        execution:
          kind: compiled
          working_dir: /workspace
          command:
            argv:
              - /usr/local/go/bin/go
              - test
              - -json
              - -p
              - "1"
              - ./...
          environment:
            CGO_ENABLED: "0"
            GOCACHE: /tmp/go-build
            GOMODCACHE: /tmp/go-mod
            GOMAXPROCS: "2"
            GOTOOLCHAIN: local
            GOPROXY: "off"
            PATH: /usr/local/go/bin:/usr/local/bin:/usr/bin:/bin

  - id: cpp
    display_name: C++
    enabled: false
    adapter: cpp
    versions:
      - version: "17"
        default: true
        runtime_image: overmindv/sandbox-gojudge-cpp:14.2.0
        limits_profile: compiled-default
        test_modes: []
        file_policy:
          max_files: 64
          allowed_extensions:
            - .cpp
            - .hpp
            - .h
          default_entrypoint: solution.cpp
        execution:
          kind: compiled
          working_dir: /workspace
          command:
            argv:
              - ./_sandbox_cpp
          environment: {}

  - id: c
    display_name: C
    enabled: false
    adapter: c
    versions:
      - version: "17"
        default: true
        runtime_image: overmindv/sandbox-gojudge-cpp:14.2.0
        limits_profile: compiled-default
        test_modes: []
        file_policy:
          max_files: 64
          allowed_extensions:
            - .c
            - .h
          default_entrypoint: solution.c
        execution:
          kind: compiled
          working_dir: /workspace
          command:
            argv:
              - ./_sandbox_c
          environment: {}

  - id: java
    display_name: Java
    enabled: false
    adapter: java
    versions:
      - version: "21"
        default: true
        runtime_image: overmindv/sandbox-gojudge-java:21.0.13.1
        limits_profile: compiled-default
        test_modes: []
        file_policy:
          max_files: 32
          allowed_extensions:
            - .java
          default_entrypoint: Main.java
        execution:
          kind: compiled
          working_dir: /workspace
          command:
            argv:
              - /usr/bin/java
          environment: {}
