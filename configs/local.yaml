schema_version: sandbox.config.v1

app:
  name: sandbox-worker
  environment: local
  worker_id: ${SANDBOX_WORKER_ID:-sandbox-worker-local-1}
  shutdown_timeout_ms: 15000

config:
  languages_file: configs/languages.yaml
  limits_file: configs/limits.yaml
  gojudge_mount_file: configs/gojudge-mount.yaml

server:
  health_addr: 0.0.0.0:8080
  metrics_addr: 0.0.0.0:9090

feature_flags:
  fake_executor: true
  gojudge_executor: false
  inline_tests: true
  object_storage_tests: false

kafka:
  brokers:
    - localhost:29092
  client_id: sandbox-worker-local
  group_id: sandbox-code-execution-v1
  topics:
    requests: code-execution.requests.v1
    events: code-execution.events.v1
    results: code-execution.results.v1
    deadletter: code-execution.deadletter.v1
  consumer:
    auto_offset_reset: earliest
    session_timeout_ms: 30000
    heartbeat_interval_ms: 3000
    max_poll_records: 16
    commit_after_result_publish: true
  producer:
    acks: all
    idempotent: true
    compression: zstd
    linger_ms: 5
    request_timeout_ms: 10000

scheduler:
  max_in_flight: 4
  job_timeout_ms: 10000
  max_in_flight_per_language:
    python: 4
  queue:
    policy: bounded_fifo
    max_depth: 16
    enqueue_timeout_ms: 100
  admission:
    reject_when_executor_unhealthy: true
    max_queue_age_ms: 300000

executor:
  type: fake
  client_timeout_ms: 10000
  fake:
    default_status: passed
    latency_ms: 50
    echo_request_metadata: true
  gojudge:
    base_url: http://localhost:5050
    request_timeout_ms: 10000
    max_idle_connections: 8

tests:
  inline:
    enabled: true
    max_files: 16
    max_total_bytes: 524288
  object_storage:
    enabled: false
    provider: disabled
    bucket: ""
    endpoint: ""
    region: ""
    cache_ttl_ms: 0

storage:
  type: memory
  postgres:
    dsn: ""
    max_open_connections: 5
    max_idle_connections: 2
  retention:
    completed_runs_days: 7
    artifacts_days: 7
    published_outbox_days: 3
    failed_outbox_days: 30
    idempotency_keys_days: 30
    worker_heartbeat_stale_ms: 120000

security:
  network:
    allow_user_code_network: false
    deny_metadata_endpoints: true
  filesystem:
    allow_absolute_paths: false
    allow_parent_segments: false
    allow_symlinks: false
    max_files: 64
  logs:
    redact_secrets: true
    max_stdout_bytes: 32768
    max_stderr_bytes: 32768

observability:
  log_level: debug
  log_format: console
  metrics_enabled: true
  tracing_enabled: false
  audit_enabled: true
